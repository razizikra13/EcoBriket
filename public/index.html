<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoBriket — Bio-arang Biomassa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1F5C40">
<meta name="description" content="EcoBriket: katalog, pencari, dan alat produksi briket bio-arang dari biomassa untuk pengguna di Indonesia dan dunia, dengan data mutu dari jurnal.">
<style>
:root{
  --forest:#1F5C40;--forest2:#2A7050;--forest-d:#163F2C;--forest-dd:#0F2E20;--leaf:#5FA777;--mint:#E6F0E8;--mint2:#F2F7F2;
  --amber:#E8A23A;--amber-d:#9A5F0B;--gold:#E8A23A;--amberbg:#FBEFD9;--char:#1C2024;--slate:#41484F;--slate2:#5F666D;
  --paper:#FFFFFF;--bg:#F7F9F5;--off:#F7F9F5;--line:#E2E8DF;--mace:#C8452F;--red:#A7362A;--redbg:#FBE7E3;
  --r:18px;--sh:0 1px 2px rgba(28,32,36,.04),0 8px 24px rgba(28,32,36,.06);--sh2:0 16px 40px rgba(28,32,36,.14);
  --head:"Space Grotesk","Poppins","Segoe UI",system-ui,sans-serif;--serif:var(--head);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--char);background:var(--bg);line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);line-height:1.15;margin:0 0 .5em;color:var(--char);letter-spacing:-.02em}
h1{font-size:clamp(1.9rem,4vw,3rem)}h2{font-size:clamp(1.4rem,2.6vw,2rem)}h3{font-size:1.15rem}h4{font-size:1rem}
p{margin:0 0 1em}a{color:var(--forest)}
svg{flex-shrink:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.skip{position:absolute;left:-999px;top:0;background:var(--forest);color:#fff;padding:8px 12px;z-index:99;border-radius:8px}.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
button,a,[role=button],summary,label{cursor:pointer}
/* ---------- header ---------- */
.top{background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);transition:box-shadow .25s var(--ease)}
.top.scrolled{box-shadow:0 6px 24px rgba(28,32,36,.08)}
.bar{display:flex;align-items:center;gap:14px;min-height:72px}
.brand{display:flex;align-items:center;gap:10px;color:var(--char);text-decoration:none;flex-shrink:0}
.brand b{font-family:var(--head);font-size:1.25rem;letter-spacing:-.03em;display:block;line-height:1.05}
.brand b span{color:var(--forest)}
.brand small{display:block;font-size:.7rem;color:var(--slate2);letter-spacing:.04em}
.nav{display:flex;gap:2px;align-items:center;margin:0 auto}
.nav>a,.dd-btn{color:var(--slate);text-decoration:none;padding:9px 12px;border-radius:999px;font-size:.92rem;font-weight:500;white-space:nowrap;background:none;border:0;font-family:inherit;display:inline-flex;align-items:center;gap:4px;min-height:40px;transition:background .2s,color .2s}
.nav>a:hover,.dd-btn:hover{background:var(--mint);color:var(--forest)}
.nav>a.active{color:var(--forest);font-weight:700;background:var(--mint)}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);padding:8px;min-width:220px;display:flex;flex-direction:column;z-index:40}
.dd-menu[hidden]{display:none}
.dd-menu a{padding:10px 12px;border-radius:10px;color:var(--char);text-decoration:none;font-size:.92rem;display:flex;align-items:center;gap:10px}
.dd-menu a:hover,.dd-menu a.active{background:var(--mint);color:var(--forest)}
.tools{display:flex;align-items:center;gap:6px;flex-shrink:0}
@media (max-width:520px){#btnFav,.dd.bell{display:none}.bar{gap:6px}.tools{gap:2px}.brand b{font-size:1.1rem}}
.ibtn{position:relative;width:42px;height:42px;border-radius:999px;border:0;background:transparent;color:var(--char);display:grid;place-items:center;text-decoration:none;transition:background .2s}
.ibtn:hover{background:var(--mint);color:var(--forest)}
.dot{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--amber);color:var(--char);font-size:.68rem;font-weight:800;display:grid;place-items:center;line-height:1}
.dot:empty{display:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{background:none;border:0;color:var(--slate);padding:6px 10px;font-weight:700;font-size:.78rem;min-height:34px;font-family:inherit}
.lang button[aria-pressed=true]{background:var(--forest);color:#fff}
.menu-btn{display:none}
.cta-top{white-space:nowrap}
@media (max-width:1100px){.tools .cta-top{display:none}}
.top .wrap{max-width:1400px}
@media (max-width:1340px) and (min-width:1141px){.brand small{display:none}}
@media (max-width:1340px){.nav>a,.dd-btn{padding:8px 10px;font-size:.9rem}}
@media (max-width:1140px){
  .menu-btn{display:grid}
  .nav{display:none;position:absolute;left:0;right:0;top:72px;background:#fff;flex-direction:column;align-items:stretch;padding:10px 16px 16px;border-bottom:1px solid var(--line);box-shadow:var(--sh2);margin:0}
  .nav.open{display:flex}
  .nav>a,.dd-btn{padding:12px 14px;justify-content:flex-start}
  .dd-btn{display:none}
  .nav .dd-menu,.nav .dd-menu[hidden]{display:flex;position:static;box-shadow:none;border:0;padding:0;min-width:0}
  .brand small{display:none}
}
@media (max-width:420px){.lang{display:none}}
/* ---------- layout ---------- */
#app{min-height:70vh;padding:24px 20px 64px;outline:none}
#app:focus,#app:focus-visible{outline:none}
.sec{margin:56px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head h2{margin:4px 0 4px}.sec-head p{margin:0;color:var(--slate2);max-width:620px}
.kicker{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--forest);font-weight:700}
.link-more{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--forest);text-decoration:none;font-size:.92rem;padding:8px 4px}
.link-more:hover{text-decoration:underline}
.phead{background:var(--mint);border-radius:28px;padding:34px 36px;margin-bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;position:relative;overflow:hidden}
.phead:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(95,167,119,.18)}
.phead>*{position:relative;z-index:1}
.phead h1{margin:6px 0 8px;font-size:clamp(1.7rem,3.2vw,2.5rem)}
.phead p{margin:0;color:var(--slate);max-width:760px}
.crumb{font-size:.8rem;color:var(--slate2)}.crumb a{color:var(--slate2);text-decoration:none}.crumb a:hover{color:var(--forest)}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--forest);background:#fff;color:var(--forest);padding:10px 18px;border-radius:12px;font-weight:600;font-size:.93rem;text-decoration:none;min-height:44px;font-family:inherit;white-space:nowrap;transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.btn:hover{background:var(--mint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--forest);color:#fff}.btn.primary:hover{background:var(--forest-d)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--char)}.btn.amber:hover{background:#DD9428}
.btn.ghost{border-color:var(--line);color:var(--slate);background:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}.btn.danger:hover{background:var(--redbg)}
.btn.light{background:#fff;border-color:#fff;color:var(--forest-d)}.btn.light:hover{background:var(--mint)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.84rem;border-radius:10px}
.btn.wa{background:var(--char);border-color:var(--char);color:#fff}.btn.wa:hover{background:#000}
.btn.block{width:100%}
.btn.pill{border-radius:999px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fav{background:#fff;border:1px solid var(--line);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;color:var(--slate2);transition:transform .15s,color .2s,background .2s}
.fav:hover{color:var(--mace)}
.fav[aria-pressed=true]{color:var(--mace);background:#FDEFEC;border-color:#F2C6BD}
.fav[aria-pressed=true] svg{fill:currentColor}
.fav.pop{animation:pop .3s var(--ease)}
@keyframes pop{50%{transform:scale(1.18)}}
/* ---------- generic surfaces ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s}
.card:hover{box-shadow:var(--sh2)}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:1.05rem}
.card .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
@media (max-width:1000px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid4{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--sh)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:860px){.two,.three{grid-template-columns:1fr}}
.two>*,.three>*,.grid>*,.grid4>*,.map-wrap>*{min-width:0}
.muted{color:var(--slate2)}.small{font-size:.87rem}.tiny{font-size:.76rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--mint);color:var(--forest);border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:600;text-decoration:none}
.chip.c-sentra-briket{background:#2B3137;color:var(--gold)}
.chip.c-pengumpul-ampas{background:#F3E8CF;color:#6E4A0B}
.chip.c-mitra-pengguna{background:#E2E9F0;color:#2C4A63}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 8px;font-size:.74rem;font-weight:700;border:1px solid transparent;line-height:1.3}
.b-grey{background:#EEEFEC;color:#4F5458;border-color:#DCDDD8}
.b-amber{background:var(--amberbg);color:#714709;border-color:#EBCB86}
.b-slate{background:#E6ECF2;color:#24425B;border-color:#C5D0DA}
.b-green{background:#DDEFE1;color:#14532D;border-color:#9FD0AE}
.b-red{background:var(--redbg);color:#922E1C;border-color:#EBB3AA}
.b-sim{background:transparent;color:#714709;border:1px dashed var(--amber)}
.notice{background:var(--amberbg);border-left:4px solid var(--amber);padding:10px 14px;border-radius:10px;font-size:.9rem;margin:0 0 16px}
.notice.green{background:var(--mint);border-color:var(--forest2)}
.notice.red{background:var(--redbg);border-color:var(--red)}
/* ---------- forms ---------- */
label{font-size:.85rem;font-weight:600;color:var(--slate);display:block;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid #D5DCD2;border-radius:12px;background:#fff;color:var(--char);min-height:44px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--forest2);box-shadow:0 0 0 3px rgba(95,167,119,.25);outline:none}
textarea{min-height:88px;resize:vertical}
input[type=checkbox]{width:auto;min-height:auto;margin-right:6px;accent-color:var(--forest)}
input[type=range]{padding:0;border:0;min-height:30px;accent-color:var(--amber);box-shadow:none}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.fg .full{grid-column:1/-1}
.hint{font-size:.74rem;color:var(--slate2);font-weight:400;margin-top:3px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{font-weight:500;display:flex;align-items:center;margin:0}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.err{color:var(--red);font-size:.86rem;margin:8px 0 0;padding-left:18px}
/* ---------- tables & results ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fff}
table.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--mint2);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--slate)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;background:var(--mint2)}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.res div{background:var(--mint2);border-radius:14px;padding:12px 14px}
.res b{display:block;font-size:1.2rem;font-family:var(--head);color:var(--forest)}
.res span{font-size:.76rem;color:var(--slate2)}
.res .hl{background:var(--forest)}.res .hl b,.res .hl span{color:#fff}
.res .neg{background:var(--redbg)}.res .neg b{color:var(--red)}
.res .pos{background:#DDEFE1}
/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,#EEF4EC 0%,#E3EEE3 60%,#F4EEDD 100%);border-radius:32px;padding:44px 44px 26px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(2.1rem,4.8vw,3.5rem);line-height:1.04;letter-spacing:-.035em;margin:10px 0 14px}
.hero h1 em{font-style:normal;color:var(--forest)}
.hero p.lead{font-size:1.08rem;color:var(--slate);max-width:520px}
.hero-art{position:relative}
.hero-art svg{width:100%;height:auto;display:block}
.float-chip{position:absolute;background:#fff;border-radius:14px;padding:9px 12px;box-shadow:var(--sh2);display:flex;align-items:center;gap:9px;font-size:.82rem;animation:floaty 5s ease-in-out infinite}
.float-chip b{font-family:var(--head);font-size:1rem;display:block;line-height:1.1}
.float-chip .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--amberbg);color:var(--amber-d)}
@keyframes floaty{50%{transform:translateY(-8px)}}
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:30px;padding-top:22px;border-top:1px solid rgba(31,92,64,.14)}
.trust div{display:flex;gap:10px;align-items:center;font-size:.86rem;font-weight:600;color:var(--slate)}
.trust .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--forest);box-shadow:var(--sh)}
@media (max-width:900px){.hero{padding:30px 22px 22px}.hero-grid{grid-template-columns:1fr}.trust{grid-template-columns:1fr 1fr}}
.cat-wrap{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
@media (max-width:900px){.cat-wrap{grid-template-columns:1fr}}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:700px){.cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 12px 14px;text-align:center;text-decoration:none;color:var(--char);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s}
.cat:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:#CFE0D2}
.cat svg{width:100%;height:auto;max-height:110px;border-radius:14px}
.cat b{font-size:.92rem;font-family:var(--head)}.cat span{font-size:.76rem;color:var(--slate2)}
.uses{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:900px){.uses{grid-template-columns:repeat(2,minmax(0,1fr))}}
.use{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;color:var(--char);display:flex;flex-direction:column;gap:10px;transition:transform .25s var(--ease),box-shadow .25s}
.use:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.use .ic{width:52px;height:52px;border-radius:16px;background:var(--mint);color:var(--forest);display:grid;place-items:center}
.use b{font-family:var(--head)}.use span{font-size:.8rem;color:var(--slate2)}
.promo{background:var(--forest-dd);color:#E8F1EA;border-radius:28px;padding:38px 40px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;position:relative;overflow:hidden}
.promo h2{color:#fff;font-size:clamp(1.6rem,3vw,2.4rem);margin:8px 0 10px}
.promo .kicker{color:var(--amber)}
.promo ol{margin:0 0 18px;padding-left:20px;color:#CFE0D4}.promo li{margin:4px 0}
.promo-art{position:relative}
.promo-art svg{width:100%;height:auto;display:block}
.seal{position:absolute;right:6px;top:0;width:108px;height:108px;border-radius:50%;background:#fff;color:var(--forest-d);display:grid;place-items:center;text-align:center;font-family:var(--head);font-weight:700;font-size:.82rem;line-height:1.1;border:3px dashed var(--amber);transform:rotate(-8deg)}
.seal b{display:block;font-size:1.6rem}
@media (max-width:860px){.promo{grid-template-columns:1fr;padding:28px 22px}}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.why div{padding:26px 22px;text-align:center;border-right:1px solid var(--line)}
.why div:last-child{border-right:0}
.why .ic{width:54px;height:54px;border-radius:50%;background:var(--mint);color:var(--forest);display:grid;place-items:center;margin:0 auto 10px}
.why b{font-family:var(--head);display:block;margin-bottom:4px}.why p{font-size:.85rem;color:var(--slate2);margin:0}
@media (max-width:860px){.why{grid-template-columns:1fr 1fr}.why div:nth-child(2){border-right:0}.why div{border-bottom:1px solid var(--line)}}
.edu{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s}
.edu:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.edu svg{width:100%;height:auto;display:block}
.edu .body{padding:16px 18px 18px}
.edu h3{font-size:1.05rem;margin:4px 0 6px}
.band{background:var(--forest);color:#fff;border-radius:24px;padding:26px 30px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.band h3{color:#fff;margin:0 0 4px;font-size:1.35rem}.band p{margin:0;color:#D5E7DA;font-size:.92rem}
/* ---------- product cards ---------- */
.pcard{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s,border-color .2s;position:relative}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:#CFE0D2}
.pimg{position:relative;aspect-ratio:4/3;overflow:hidden}
.pimg>svg{width:100%;height:100%;display:block;transition:transform .5s var(--ease)}
.pcard:hover .pimg>svg{transform:scale(1.05)}
.pimg .tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border-radius:8px;padding:3px 8px;font-size:.68rem;font-weight:800;letter-spacing:.06em;color:var(--slate)}
.pimg .fav{position:absolute;right:10px;top:10px;width:38px;height:38px}
.pimg .qv{position:absolute;right:10px;bottom:10px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.pcard:hover .qv,.qv:focus-visible{opacity:1;transform:none}
@media (hover:none){.pimg .qv{opacity:1;transform:none}}
.pbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcat{font-size:.74rem;color:var(--slate2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pbody h3{margin:0;font-size:1.02rem;line-height:1.25}
.pbody h3 a{color:var(--char);text-decoration:none}.pbody h3 a:hover{color:var(--forest)}

.gal-main{border-radius:26px;overflow:hidden;border:1px solid var(--line);background:#fff;aspect-ratio:4/3}

.thumbs button svg{width:100%;height:100%;display:block}
.thumbs button span{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);border-radius:6px;padding:1px 6px;font-size:.68rem;font-weight:700;color:var(--char)}

.burnhero{background:var(--char);color:#F5F2EA;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px}

.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.facts div{background:var(--mint2);border-radius:14px;padding:10px 12px;font-size:.8rem;color:var(--slate2)}
.facts b{display:block;color:var(--char);font-size:.98rem;font-family:var(--head)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;background:var(--mint2);padding:6px;border-radius:16px;width:fit-content;max-width:100%}

.sim{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}

.sim-stage{background:radial-gradient(circle at 50% 70%,#2A2522 0%,#161819 70%);border-radius:22px;aspect-ratio:4/3;overflow:hidden}
.sim-stage svg{width:100%;height:100%;display:block}
.phase{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-family:var(--head);font-size:1.1rem}
.phase i{width:12px;height:12px;border-radius:50%;display:inline-block}
.timeline{position:relative;height:10px;background:linear-gradient(90deg,#E8A23A 0 8%,#D9582A 8% 60%,#9C6B4A 60% 85%,#BDB8AE 85%);border-radius:6px;margin:12px 0 6px}

.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite}
.flame.b{animation-duration:.8s;animation-delay:-.3s}
@keyframes flick{0%,100%{transform:scaleY(1) scaleX(1)}35%{transform:scaleY(1.12) scaleX(.94)}70%{transform:scaleY(.92) scaleX(1.05)}}

/* ---------- compare / cart / overlays ---------- */
.cmpbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--char);color:#fff;border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;z-index:35;box-shadow:var(--sh2);max-width:calc(100vw - 24px)}

.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100vw);background:#fff;z-index:45;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.15);animation:slidein .28s var(--ease)}

.drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}

.cmp{display:grid;gap:16px}

.cmp-row{padding:12px 16px;border-top:1px solid var(--line);font-size:.88rem}

.sres a{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;text-decoration:none;color:var(--char)}

.sres .th svg{width:100%;height:100%}
/* ---------- reused modules ---------- */
.hero-mini{background:var(--forest);border-radius:22px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}

.stats span{font-size:.8rem;color:var(--slate2)}

.dark{background:var(--forest-dd);color:#E3EDE5;border-radius:28px;padding:30px}

.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}

@media (max-width:520px){.stages{grid-template-columns:repeat(2,1fr)}}

.stg[aria-pressed=true] .n{background:var(--forest);color:#fff}
.stg b{display:flex;align-items:center;gap:6px}
.stg small{display:block;color:var(--slate2);font-size:.75rem}
.progress{height:10px;background:#E8ECE5;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--forest2),var(--leaf));border-radius:99px;transition:width .3s}
.pips{display:flex;gap:4px}
.pips span{flex:1;height:8px;border-radius:4px;background:#E8ECE5}
.pips span.on{background:var(--forest2)}.pips span.cur{background:var(--amber)}
.timer-big{font-family:var(--head);font-size:clamp(2.2rem,6vw,3.4rem);color:var(--forest);font-variant-numeric:tabular-nums;line-height:1}
.wx{display:flex;gap:6px;flex-wrap:wrap}
.wx div{background:var(--mint2);border-radius:10px;padding:6px 8px;text-align:center;font-size:.74rem;min-width:54px}
.wx div b{display:grid;place-items:center;margin-bottom:2px}
.wx .now{outline:2px solid var(--amber)}
#tmWx{display:flex;align-items:center;gap:8px}
.map-wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
@media (max-width:900px){.map-wrap{grid-template-columns:1fr}}
.map svg{width:100%;height:auto;display:block;border-radius:16px}
.pin{cursor:pointer}.pin:hover circle.o,.pin.sel circle.o{r:13;stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.82rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.modal{position:fixed;inset:0;background:rgba(15,20,18,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;animation:fade .2s}
.modal[hidden]{display:none}

.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}

.modal .mb{padding:20px}

.x{background:none;border:0;font-size:1.5rem;min-width:42px;min-height:42px;color:var(--slate);border-radius:50%}
.x:hover{background:var(--mint)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--char);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;font-size:.92rem;display:flex;gap:8px;align-items:center}
#toast.show{opacity:1}
.ill{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#E8ECE5}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:.92rem}
.kv dt{color:var(--slate2)}.kv dd{margin:0;font-weight:600}
.bars div{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:.84rem;margin-bottom:6px}
.bars i{display:block;height:10px;background:var(--amber);border-radius:5px}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{padding:6px 0 6px 26px;position:relative;font-size:.92rem;border-bottom:1px dashed var(--line)}
.checklist li:before{content:"✓";position:absolute;left:4px;color:var(--forest2);font-weight:800}
.checklist li.no:before{content:"✗";color:var(--red)}
.burn{background:var(--amberbg);border:1px solid #EBCB86;border-radius:10px;padding:6px 10px;font-size:.88rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#5E3D07}

.score{height:8px;background:#E8ECE5;border-radius:4px;overflow:hidden;margin-top:4px}.score i{display:block;height:100%;background:var(--amber)}
.fd-card{display:grid;grid-template-columns:1.1fr 1.2fr 1fr;gap:16px;align-items:start}
.fd-thumb{border-radius:14px;overflow:hidden;margin-bottom:8px;aspect-ratio:16/9}.fd-thumb svg{width:100%;height:100%;display:block}

.fd-card>*{min-width:0}
.ok{color:#14532D;font-weight:700}.bad{color:var(--red);font-weight:700}
.empty{padding:34px;text-align:center;color:var(--slate2);border:2px dashed var(--line);border-radius:18px;background:#fff}
/* ---------- footer ---------- */
footer.site{background:var(--forest-dd);color:#C9D8CD;margin-top:40px;font-size:.9rem}
footer.site .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:28px;padding:48px 20px 28px}
@media (max-width:860px){footer.site .cols{grid-template-columns:1fr 1fr}}

footer.site a:hover{color:#fff}
footer.site .brand b{color:#fff}footer.site .brand b span{color:var(--amber)}
footer.site .legal{border-top:1px solid rgba(255,255,255,.1);padding:16px 20px;font-size:.78rem;color:#A9BFB0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* ---------- motion ---------- */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}

.oauth{display:grid;gap:10px;margin:6px 0 4px}
.oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--char);font:600 .95rem var(--sans);text-decoration:none;padding:8px 16px;cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease)}
.oauth-btn:hover:not(:disabled){background:var(--mint);border-color:var(--forest2)}
.oauth-btn:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.oauth-btn:disabled{opacity:.6;cursor:not-allowed}
.oauth-btn em{font-style:normal;font-size:.72rem;font-weight:600;color:var(--slate2);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}
.gbtn-slot{min-height:44px;display:flex;justify-content:center}
.divider{display:flex;align-items:center;gap:12px;color:var(--slate2);font-size:.82rem;margin:14px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:46px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;border-radius:10px;color:var(--slate2);cursor:pointer;display:grid;place-items:center}
.pw-eye.on{color:var(--forest)}
.pw-eye:focus-visible{outline:3px solid var(--leaf)}
.pw-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.pw-meter i{height:5px;border-radius:3px;background:var(--line);transition:background .25s}
.pw-meter[data-s="1"] i:nth-child(-n+1){background:var(--red)}
.pw-meter[data-s="2"] i:nth-child(-n+2){background:var(--amber)}
.pw-meter[data-s="3"] i:nth-child(-n+3){background:var(--leaf)}
.pw-meter[data-s="4"] i{background:var(--forest)}
[aria-invalid="true"]{border-color:var(--red)!important;box-shadow:0 0 0 3px var(--redbg)}
.danger-zone{border-color:#EBB3AA}
#srvReg,#completeForm,#editForm{max-width:920px}
button[aria-busy="true"]{opacity:.7;cursor:progress}
@media (max-width:860px){.auth-wrap{grid-template-columns:1fr}.auth-card{max-width:none}.auth-aside{display:none}}
@media (prefers-reduced-motion:reduce){.oauth-btn,.pw-meter i{transition:none}}
</style>

/* ======================= calculations (pure) ======================= */
function calcFormula(p) {
  const kering = p.wet * (1 - p.ka0/100);
  const setelahJemur = kering / (1 - p.ka1/100);
  const arang = kering * p.rend/100;
  const bubuk = arang * (1 - p.susut/100);
  const tapioka = bubuk * p.tap/100;
  const airLem = tapioka * p.air;
  const adonan = bubuk + tapioka + airLem;
  const briket = (bubuk + tapioka) / (1 - p.ka2/100);
  const rendemen = p.wet > 0 ? briket / p.wet * 100 : 0;
  const butir = p.piece > 0 ? Math.floor(briket * 1000 / p.piece) : 0;
  return {kering, setelahJemur, arang, bubuk, tapioka, airLem, adonan, briket, rendemen, butir};
}
function calcEnergy(p) {
  const kayuKg = p.m3 * p.cyc * p.dens;
  const energi = kayuKg * p.nkk;
  const sub = p.sub/100;
  const hematM3 = p.m3 * p.cyc * sub;
  const hematKg = hematM3 * p.dens;
  const briketKg = p.nkb > 0 ? energi * sub / p.nkb : 0;
  const hematRp = hematM3 * p.price;
  const biayaBriket = briketKg * p.cost;
  const net = hematRp - biayaBriket;
  const co2 = hematKg * p.ef * p.fnrb;
  return {kayuKg, energi, hematM3, hematKg, briketKg, hematRp, biayaBriket, net, co2};
}
function recommend(inp) {
  return S.skema.map(s => {
    const a = s.aturan || {};
    const checks = [
      {ok: inp.ketel >= num(a.minKap) && inp.ketel <= num(a.maxKap, 1e9), txt: `${t('rr_kap')} (${fmt(a.minKap,0)}–${fmt(a.maxKap,0)} kg)`},
      {ok: inp.target >= num(a.minTarget) && inp.target <= num(a.maxTarget, 100), txt: `${t('rr_tgt')} (${fmt(a.minTarget,0)}–${fmt(a.maxTarget,0)}%)`},
      {ok: !a.butuhMesin || inp.press, txt: `${t('rr_press')} (${a.butuhMesin ? t('yes') : t('no')})`},
      {ok: inp.tk >= num(a.minTK), txt: `${t('rr_tk')} (≥ ${fmt(a.minTK,0)})`},
    ];
    const pass = checks.filter(c => c.ok).length;
    const mills = S.pabrik.filter(p => p.kategori !== 'mitra-pengguna' && p.kapasitasAmpasKg >= num(a.minKap) && p.kapasitasAmpasKg <= num(a.maxKap, 1e9));
    return {s, checks, pass, diff: Math.abs(num(s.estimasiHematKayu) - inp.target), mills};
  }).sort((x, y) => y.pass - x.pass || x.diff - y.diff);
}
function needFor(p, inp) {
  const base = PAKAI_BASE[inp.use] || PAKAI_BASE['tungku-usaha'];
  const rate = base.kg * 5000 / Math.max(2000, nkOf(p));
  const kgDay = rate * inp.jam * inp.tungku;
  return {rate, kgDay, costDay: kgDay * num(p.hargaPerKg), kgTotal: kgDay * (inp.hari || 1), piecesHour: p.beratButirGram > 0 ? rate * 1000 / p.beratButirGram : 0};
}
function findBriket(inp) {
  return S.produk.map(p => {
    const n = needFor(p, inp); const hard = [], soft = [];
    if (inp.sni === 'lab') hard.push({ok: p.statusStandarSni === 'terverifikasi', txt: t('fr_sni')});
    else if (inp.sni) hard.push({ok: p.statusStandarSni === 'terverifikasi' || potensi(p).s === 'ya', txt: tl(['Berpotensi SNI menurut literatur','SNI potential per literature'])});
    if (inp.smoke) hard.push({ok: p.tingkatAsap === 'rendah', txt: `${t('fr_smoke')} (${el('asap', p.tingkatAsap)})`});
    soft.push({ok: (p.cocokUntuk || []).includes(inp.use), txt: `${t('fr_use')}: ${el('pakai', inp.use)}`, w: 3});
    soft.push({ok: num(p.lamaBakarMenit) >= inp.min, txt: `${t('fr_burn')} (${fmt(p.lamaBakarMenit,0)} ≥ ${fmt(inp.min,0)} mnt)`, w: 2});
    if (inp.budget > 0) soft.push({ok: n.costDay <= inp.budget, txt: `${t('fr_budget')} (${rp(n.costDay)} ≤ ${rp(inp.budget)})`, w: 2});
    soft.push({ok: num(p.stokKg) >= n.kgTotal, txt: `${t('fr_stock')} (${fmt(p.stokKg,0)} / ${fmt(n.kgTotal,0)} kg)`, w: 1});
    if (inp.bahan) soft.push({ok: p.bahanBaku === inp.bahan, txt: t('fr_bahan'), w: 1});
    const max = soft.reduce((a, c) => a + c.w, 0), got = soft.filter(c => c.ok).reduce((a, c) => a + c.w, 0);
    return {p, n, hard, soft, pass: hard.every(c => c.ok), score: Math.round(got / max * 100)};
  }).sort((a, b) => b.pass - a.pass || b.score - a.score || a.n.costDay - b.n.costDay);
}

function weatherAt(h, seed) {
  const hod = (8 + h) % 24;
  if (hod < 6 || hod >= 18) return 'malam';
  const r = Math.abs(Math.sin((h + 1) * 12.9898 + seed * 78.233) * 43758.5453) % 1;
  return r < .55 ? 'cerah' : r < .85 ? 'berawan' : 'hujan';
}
const WXF = {cerah:1, berawan:.6, hujan:0, malam:.15};
const WXI = {cerah:ico('sun',20), berawan:ico('cloud',20), hujan:ico('rain',20), malam:ico('moon',20)};
function planBuild(p) {
  const BRI_PER_M3 = 400 * 15 / 20; // kg briket setara 1 m³ kayu (densitas 400, NK 15 vs 20) — simulasi
  const rows = []; let stock = 0; const amp = [];
  for (let d = 0; d < p.days; d++) {
    const date = new Date(p.start); date.setDate(date.getDate() + d);
    amp[d] = p.cyc * p.amp;
    const acts = [];
    for (let c = 0; c < p.cyc; c++) { const s = 6 + c * p.dur; const e = s + p.dur; acts.push(`${String(Math.floor(s)).padStart(2,'0')}:${s % 1 ? '30' : '00'}–${String(Math.floor(e) % 24).padStart(2,'0')}:${e % 1 ? '30' : '00'} ${t('a_suling')} #${c+1}`); }
    acts.push(t('a_jemur1'));
    if (d >= 1) acts.push(`${t('a_karbon')} ${d}`);
    if (d >= 2) acts.push(`${t('a_cetak')} ${d-1}; ${t('a_jemur2')}`);
    const ready = d >= 3 ? amp[d-3] * p.rend/100 : 0;
    if (d >= 3) acts.push(`${t('a_siap')} ${d-2} ${t('a_siap2')}: ${fmt(ready)} kg`);
    stock += ready;
    const k0 = p.cyc * p.kayu;
    const need = k0 * p.sub/100 * BRI_PER_M3;
    const used = Math.min(stock, need); stock -= used;
    rows.push({day: d+1, date: date.toISOString().slice(0,10), acts, amp: amp[d], ready, used, k0, k1: k0 - used / BRI_PER_M3});
  }
  return {rows, stock};
}

/* ---- timer engine ---- */
function timerTick() {
  const T = S.timer; if (!T.running) return;
  const now = Date.now(); let dt = Math.max(0, now - (T.lastTick || now)) * T.speed; T.lastTick = now;
  const target = T.targetH * 36e5; let guard = 0;
  while (dt > 0 && T.simMs < target && guard++ < 20000) {
    const h = Math.floor(T.simMs / 36e5); const step = Math.min(dt, (h + 1) * 36e5 - T.simMs, target - T.simMs);
    T.effMs += step * WXF[weatherAt(h, T.seed)]; T.simMs += step; dt -= step;
  }
  if (T.simMs >= target) { T.running = false; toast(t('tm_done')); }
}
const hms = ms => { const s = Math.floor(ms / 1000); return [Math.floor(s/3600), Math.floor(s%3600/60), s%60].map(x => String(x).padStart(2,'0')).join(':'); };
function timerUI() {
  const T = S.timer; if (!$('#tmClock')) return;
  const target = T.targetH * 36e5; const h = Math.floor(T.simMs / 36e5); const w = weatherAt(h, T.seed);
  $('#tmClock').textContent = hms(T.simMs);
  $('#tmBar').style.width = Math.min(100, T.simMs / target * 100) + '%';
  $('#tmInfo').innerHTML = `${t('tm_left')}: <b>${hms(Math.max(0, target - T.simMs))}</b> · ${t('tm_eff')}: <b>${fmt(T.effMs / 36e5)} / ${fmt(T.targetH)} h</b> · ${T.mode === 'awal' ? t('tm_awal') : t('tm_akhir')}`;
  $('#tmToggle').textContent = T.running ? t('tm_pause') : t('tm_start');
  $('#tmWx').innerHTML = `${WXI[w]} ${t('wx_' + w)} · ${tl(['faktor','factor'])} ${WXF[w]}`;
  $('#tmAdv').textContent = t('adv_' + w);
  $('#tmFc').innerHTML = Array.from({length:8}, (_, i) => { const hh = h + i; const ww = weatherAt(hh, T.seed); return `<div class="${i===0?'now':''}"><b>${WXI[ww]}</b>${String((8+hh)%24).padStart(2,'0')}:00</div>`; }).join('');
  $('#tmWeak').hidden = !(T.simMs >= target && T.effMs < target / 2);
}

const STOK_F0 = () => ({q:'', g:'', m:'', u:'', s:'', mb:'', sort:'na'});
function filterProduk(f) {
  const q = (f.q || '').trim().toLowerCase();
  const a = S.produk.filter(p => (!q || [p.nama, p.gampong, p.deskripsi, el('bahan', p.bahanBaku), p.sumberVerifikasi].join(' ').toLowerCase().includes(q)) && (!f.g || p.gampong === f.g) && (!f.m || p.bahanBaku === f.m) && (!f.u || (p.cocokUntuk || []).includes(f.u)) && (!f.s || p.statusStandarSni === f.s) && (!f.mb || num(p.lamaBakarMenit) >= num(f.mb)));
  const cmp = {na:(x,y)=>x.nama.localeCompare(y.nama), pa:(x,y)=>x.hargaPerKg-y.hargaPerKg, pd:(x,y)=>y.hargaPerKg-x.hargaPerKg, sd:(x,y)=>y.stokKg-x.stokKg, bd:(x,y)=>y.lamaBakarMenit-x.lamaBakarMenit, nd:(x,y)=>nkOf(y)-nkOf(x)};
  return a.sort(cmp[f.sort] || cmp.na);
}
const nkText = p => `${fmt(nkOf(p),0)} kal/g${p.uji && p.uji.sumber === 'lab' ? '' : p.uji && p.uji.sumber === 'literatur' ? ` <span class="tiny muted">(${tl(['literatur','literature'])})</span>${refLink(p.uji.refId)}` : ` <span class="tiny muted">(${t('est')})</span>`}`;
const burnBox = (p, full = true) => `<div class="burn">${ico('clock',16)} ${full ? t('burn') + ': ' : ''}<b>±${fmt(p.lamaBakarMenit,0)} ${p.kategoriBentuk === 'curah-arang' ? tl(['menit/isian 1 kg','min per 1 kg load']) : t('per_piece')}</b><span class="tiny">(${fmt(p.beratButirGram,0)} g)</span></div>`;

const fo = (v, d = 1) => (v === '' || v == null) ? '—' : fmt(v, d);
const stats = a => a.length ? {n: a.length, mean: a.reduce((x, y) => x + y, 0) / a.length, min: Math.min(...a), max: Math.max(...a)} : {n:0, mean:0, min:0, max:0};
function logCSV() {
  const cols = ['id','namaResponden','gampong','tanggalObservasi','penguranganKayuPersen','rendemenBriketPersen','suhuTungkuCelcius','catatanKualitatif','kendalaLapangan','kodeTema'];
  const q = v => '"' + String(Array.isArray(v) ? v.join(';') : v ?? '').replace(/"/g, '""') + '"';
  return '﻿' + [cols.join(','), ...S.logbook.map(r => cols.map(c => q(r[c])).join(','))].join('\r\n');
}

function cellVal(ent, k, o) {

  if (!f) return esc(v);
  if (f.type === 'checkbox') return v ? '✓' : '—';
  if (f.type === 'select') { const m = f.o().find(x => String(x[0]) === String(v)); return esc(m ? m[1] : v); }

function fieldHTML(f, o) {

  if (f.type === 'textarea') return `<div${cls}>${lab}<textarea id="${id}" name="${f.k}">${esc(v)}</textarea></div>`;
  if (f.type === 'select') return `<div${cls}>${lab}<select id="${id}" name="${f.k}">${f.o().map(([a, b]) => `<option value="${esc(a)}" ${String(a) === String(v) ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></div>`;
  if (f.type === 'checkbox') return `<div${cls} style="align-self:end"><label><input type="checkbox" id="${id}" name="${f.k}" ${v ? 'checked' : ''}>${esc(tl(f.l))}</label></div>`;
  if (f.type === 'multi') return `<div${cls}><label>${esc(tl(f.l))}</label><div class="checks">${f.o().map(([a, b]) => `<label><input type="checkbox" name="${f.k}" value="${esc(a)}" ${(v || []).includes(a) ? 'checked' : ''}>${esc(b)}</label>`).join('')}</div></div>`;
  return `<div${cls}>${lab}<input id="${id}" name="${f.k}" type="${f.type}" value="${esc(v ?? '')}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.type === 'number' ? `step="${f.step || 1}"` : ''}></div>`;
}
function openForm(ent, id) {

      else { const raw = fm.querySelector(`[name="${f.k}"]`).value.trim(); v = raw;

        if (f.type === 'number') { v = raw === '' ? (f.opt ? '' : 0) : num(raw); if (raw !== '' && f.min != null && v < f.min) errs.push(`${tl(f.l)} ${t('v_min')} ${f.min}`); if (f.max != null && v > f.max) errs.push(`${tl(f.l)} ${t('v_max')} ${f.max}`); }

    });

  };
}

function bindSim(getP) {
  clearInterval(simTimer); let f = 0, playing = false;
  const draw = () => { if (!$('#simStage')) return; const p = getP(); const L = num(p.lamaBakarMenit, 60); const ph = phaseOf(f);
    $('#simStage').innerHTML = burnSVG(p, f); $('#simPhase').innerHTML = `<i style="background:${ph.c}"></i>${esc(ph.l)}`;
    $('#simTime').textContent = `${fmt(f*L,0)} / ±${fmt(L,0)} ${tl(['menit','min'])}`; $('#simMk').style.left = `calc(${f*100}% - 2px)`;
    $('#simRange').value = Math.round(f*1000); $('#simAdv').textContent = ph.a; $('#simEnd').textContent = `±${fmt(L,0)} ${tl(['mnt','min'])}`; };
  const label = () => $('#simPlay').innerHTML = playing ? `${ico('pause', 16)} ${tl(['Jeda','Pause'])}` : `${ico('play', 16)} ${tl(['Putar simulasi','Play simulation'])}`;
  const stop = () => { playing = false; clearInterval(simTimer); label(); };
  const play = () => { if (f >= 1) f = 0; playing = true; label(); clearInterval(simTimer);
    simTimer = setInterval(() => { if (!$('#simStage')) { clearInterval(simTimer); return; } const p = getP(); f = Math.min(1, f + .25 * num($('#simSpeed').value, 300) / (num(p.lamaBakarMenit, 60) * 60)); draw(); if (f >= 1) stop(); }, 250); };
  $('#simPlay').onclick = () => playing ? stop() : play();
  $('#simReset').onclick = () => { stop(); f = 0; draw(); };
  $('#simRange').oninput = e => { stop(); f = e.target.value / 1000; draw(); };
  label(); draw();
  return {reset: () => { stop(); f = 0; draw(); }, set: v => { stop(); f = v; draw(); }};
}

function potensi(p) {
  const u = p.uji || {}; if (!['literatur','lab'].includes(u.sumber)) return {s: 'belum'};
  const have = SNI_P.filter(([k]) => isNum(u[k])); if (!have.length) return {s: 'belum'};
  const fail = have.filter(([k, , op, lim]) => !meets(u[k], op, lim));
  return fail.length ? {s: 'tidak', fail} : {s: have.length === 4 ? 'ya' : 'sebagian', n: have.length};
}
function potensiBadge(p) {
  const r = potensi(p), ref = p.uji && p.uji.refId ? ' · ' + p.uji.refId : '';
  if (r.s === 'ya') return `<span class="badge b-green" title="${esc(tl(['Nilai literatur bahan sejenis memenuhi 4 parameter SNI; produk ini belum diuji','Literature values for this material meet all 4 SNI parameters; this product is not tested']))}">${ico('book', 13)} ${tl(['Potensi SNI (literatur','SNI potential (literature'])}${ref})</span>`;
  if (r.s === 'sebagian') return `<span class="badge b-slate">${ico('book', 13)} ${tl(['Literatur parsial','Partial literature'])} ${r.n}/4${ref}</span>`;
  if (r.s === 'tidak') return `<span class="badge b-red">${ico('book', 13)} ${tl(['Literatur: di luar SNI','Literature: outside SNI'])} (${r.fail.map(f => tl(SHORT[f[0]])).join(', ')})</span>`;
  return `<span class="badge b-grey">${ico('book', 13)} ${tl(['Belum ada data jurnal','No journal data yet'])}</span>`;

const CLOUD = {db: null, uid: null, name: '', downloads: null, state: 'local'};
let syncT = null, syncing = false, syncAgain = false;
const cloudDoc = () => CLOUD.db.doc('data/users/' + CLOUD.uid + '/app');
function cloudState(s) { CLOUD.state = s; $$('.syncdot').forEach(d => { d.dataset.s = s; }); }
const CLOUD_LBL = {local:['Tersimpan di perangkat ini','Saved on this device'], loading:['Menyambung ke akun…','Connecting to account…'], synced:['Tersinkron ke akun Claude','Synced to Claude account'], error:['Sinkron gagal — tersimpan lokal','Sync failed — saved locally'], readonly:['Akses baca saja — tersimpan lokal','Read-only access — saved locally'], full:['Data terlalu besar untuk sinkron','Data too large to sync']};
function scheduleSync() { if (typeof SRV !== 'undefined' && SRV.on) { if (SRV.user) { clearTimeout(srvT); srvT = setTimeout(pushServer, 1200); } return; } if (!CLOUD.db || !CLOUD.uid) return; clearTimeout(syncT); syncT = setTimeout(pushCloud, 1500); }
async function pushCloud() {
  if (!CLOUD.db) return; if (syncing) { syncAgain = true; return; } syncing = true;
  try { const o = Object.assign({}, S); delete o.ui; o.timer = Object.assign({}, S.timer, {running: false}); const json = JSON.stringify(o);
    if (json.length > 240000) cloudState('full'); else { await cloudDoc().set({json, updated: S.updated || Date.now()}); cloudState('synced'); } }
  catch (e) { cloudState(e && e.code === 'invalid_argument' ? 'readonly' : 'error'); }
  syncing = false; if (syncAgain) { syncAgain = false; pushCloud(); }
}
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [user, db, dl] = await Promise.all([claude.use('user'), claude.use('db'), claude.use('downloads')]);
    CLOUD.downloads = dl || null;
    if (!user || !db) return;
    const id = await user.id(); if (!id) return;
    try { const ps = await user.profiles([id]); CLOUD.name = (ps && ps[id] && ps[id].name) || ''; } catch (e) {}
    CLOUD.db = db; CLOUD.uid = id; cloudState('loading');
    const timer = setTimeout(() => cloudState('error'), 10000);
    const snap = await cloudDoc().get(); clearTimeout(timer);
    if (snap.exists) {
      const d = snap.data() || {}; let remote = null; try { remote = JSON.parse(d.json || 'null'); } catch (e) {}
      if (remote && remote.v === 3 && num(d.updated) > num(S.updated)) { const ui = S.ui; S = Object.assign(seedData(), remote, {ui}); saveLocal(); toast(tl(['Data akun dipulihkan dari cloud','Account data restored from cloud'])); }
      else if (num(S.updated) > num(d.updated)) await pushCloud();
    } else if ((S.users || []).length) await pushCloud();
    cloudState('synced'); render();
  } catch (e) { cloudState('error'); }
}

const SRV = {on: false, cfg: null, user: null, gisLoaded: false};
CLOUD_LBL.server = ['Tersinkron ke server EcoBriket','Synced to EcoBriket server'];
CLOUD_LBL.guest = ['Tamu — tersimpan di browser ini','Guest — saved in this browser'];
async function api(url, method = 'GET', body) {
  const r = await fetch(url, {method, credentials: 'same-origin', headers: Object.assign({'X-EcoBriket': '1'}, body ? {'Content-Type': 'application/json'} : {}), body: body ? JSON.stringify(body) : undefined});
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw Object.assign(new Error(d.error || ('HTTP ' + r.status)), {status: r.status, fields: d.fields || {}});
  return d;
}
const srvMe = () => SRV.user ? Object.assign({}, SRV.user, {gampong: lokasiPendek(SRV.user)}) : null;
async function initServer() {
  if (!/^https?:$/.test(location.protocol)) return false;
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch('/api/config', {credentials: 'same-origin', signal: ctl.signal}); clearTimeout(tm);
    if (!r.ok) return false; const cfg = await r.json(); if (cfg.app !== 'ecobriket') return false;
    SRV.on = true; SRV.cfg = cfg;
    if (cfg.user) await afterLogin(cfg.user, true); else cloudState('guest');
    render(); return true;
  } catch (e) { return false; }
}
async function afterLogin(user, quiet) {
  SRV.user = user; S.session = user.id; cloudState('loading');
  if (user.bahasa && user.bahasa !== S.settings.lang && !quiet) { S.settings.lang = user.bahasa; }
  try {
    const st = await api('/api/state'); let remote = null; try { remote = JSON.parse(st.json || 'null'); } catch (e) {}
    if (remote && remote.v === 3) {
      const guestCart = quiet ? [] : (S.cart || []), guestFav = quiet ? [] : (S.favorit || []), ui = S.ui, lang = S.settings.lang;
      S = Object.assign(seedData(), remote, {ui}); S.settings.lang = lang; S.session = user.id;
      guestCart.forEach(c => { if (!S.cart.some(x => x.id === c.id)) S.cart.push(c); });
      guestFav.forEach(f => { if (!S.favorit.includes(f)) S.favorit.push(f); });
      saveLocal(); if (!quiet && (guestCart.length || guestFav.length)) await pushServer();
    } else await pushServer();
    cloudState('server');
  } catch (e) { cloudState('error'); }
  if (typeof renderUserMenus === 'function') renderUserMenus();
}
let srvT = 0, srvBusy = false, srvAgain = false;
async function pushServer() {
  if (!SRV.user) return; if (srvBusy) { srvAgain = true; return; } srvBusy = true;
  try { const o = Object.assign({}, S); delete o.ui; await api('/api/state', 'PUT', {json: JSON.stringify(o), updated: S.updated || Date.now()}); cloudState('server'); }
  catch (e) { cloudState(e.status === 401 ? 'guest' : 'error'); if (e.status === 401) { SRV.user = null; S.session = null; } }
  srvBusy = false; if (srvAgain) { srvAgain = false; pushServer(); }
}
async function srvLogout() {
  try { await pushServer(); await api('/api/auth/logout', 'POST', {}); } catch (e) {}
  const lang = S.settings.lang, ui = S.ui; SRV.user = null;
  // Kosongkan data di browser agar pengguna berikutnya di perangkat yang sama tidak melihatnya.
  S = Object.assign(seedData(), {ui}); S.settings.lang = lang; S.settings.onboarded = true; S.ui.akTab = 'masuk'; saveLocal(); cloudState('guest');
  toast(tl(['Anda sudah keluar.','You are signed out.'])); location.hash = '#/akun'; render();
}

// Cegah CSV/formula injection (OWASP): sel teks yang diawali = + - @ diberi awalan ' agar Excel tidak mengeksekusinya.
const csvCell = v => { let s = Array.isArray(v) ? v.join('|') : (v == null ? '' : String(v)); if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+([.,]\d+)?$/.test(s)) s = "'" + s; return /[",;\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = (head, rows) => '﻿' + [head.map(csvCell).join(','), ...rows.map(r => r.map(csvCell).join(','))].join('\r\n');
function parseCSV(text) {
  text = String(text || '').replace(/^﻿/, ''); const first = text.split(/\r?\n/)[0] || '';
  const d = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === d) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else cell += c; }
  row.push(cell); if (row.some(x => x !== '')) rows.push(row);
  return rows;
}
const IO_TABS = ['produk', 'pabrik', 'batch', 'logbook'];
const schemaCols = tab => ['id'].concat(SCHEMA[tab].fields.map(f => f.k));
const tableCSV = tab => toCSV(schemaCols(tab), S[tab].map(o => schemaCols(tab).map(k => getPath(o, k))));
function coerceRow(tab, head, cells) {
  const sc = SCHEMA[tab]; const o = JSON.parse(JSON.stringify(sc.blank || {})); o.id = uid(sc.prefix); const errs = [];
  head.forEach((h, i) => { const k = h.trim(); const raw = (cells[i] == null ? '' : String(cells[i])).trim().replace(/^'(?=[=+\-@])/, '');
    if (k === 'id') { if (raw) o.id = raw; return; }
    const f = sc.fields.find(x => x.k === k); if (!f) return;
    let v = raw;
    if (f.type === 'number') { if (raw === '') v = f.opt ? '' : 0; else { v = num(raw, NaN); if (!isFinite(v)) { errs.push(`${tl(f.l)}: ${tl(['bukan angka','not a number'])}`); v = 0; } } if (f.num) v = num(raw, 1); }
    else if (f.type === 'checkbox') v = /^(1|true|ya|yes|y|x)$/i.test(raw);
    else if (f.type === 'multi') { const ok = f.o().map(x => x[0]); v = raw ? raw.split('|').map(s => s.trim()).filter(Boolean) : []; const bad = v.filter(x => !ok.includes(x)); if (bad.length) errs.push(`${tl(f.l)}: ${bad.join(', ')} ${tl(['tidak dikenal','unknown'])}`); v = v.filter(x => ok.includes(x)); }
    else if (f.type === 'select') { const ok = f.o().map(x => String(x[0])); if (raw && !ok.includes(raw)) errs.push(`${tl(f.l)}: "${raw}" ${tl(['tidak dikenal','unknown'])}`); if (!raw) return; if (f.num) v = num(raw, 1); }
    setPath(o, k, v); });
  sc.fields.forEach(f => { if (f.req && (getPath(o, f.k) === '' || getPath(o, f.k) == null)) errs.push(`${tl(f.l)} ${t('v_req')}`); });
  if (sc.validate) errs.push(...sc.validate(o));
  return {o, errs};
}

      $$('[data-cite]').forEach(b => b.onclick = async () => { const r = refById(b.dataset.cite); const txt = `${r.a}. ${r.topik}. ${r.url}`; try { await navigator.clipboard.writeText(txt); toast(tl(['Sitasi tersalin','Citation copied'])); } catch (e) { showCopy(r.id + '.txt', txt); } }); };
    $('#rq').addEventListener('input', draw); draw();
    $('[data-csv-ref]').onclick = () => exportFile('ecobriket-referensi.csv', toCSV(['id','penulis_sumber','topik','data','url'], REFS.map(r => [r.id, r.a, r.topik, r.data, r.url])), 'text/csv');
    if (hl) setTimeout(() => { const e = $('#ref-' + hl); if (e) e.scrollIntoView({block: 'center'}); }, 80);
  }
};

/* ======================= header extras: user + activity menus ======================= */
function renderUserMenus() {
  const u = me(); const ub = $('#btnUser');
  ub.innerHTML = (u ? `<span class="avatar">${esc(initials(u.nama))}</span>` : ico('user', 20)) + `<span class="syncdot" data-s="${CLOUD.state}"></span>`;
  ub.setAttribute('aria-label', u ? u.nama : t('nav_akun'));
  $('#userMenu').innerHTML = (u ? `<div class="pm-head"><span class="avatar lg">${esc(initials(u.nama))}</span><div><b>${esc(u.nama)}</b><div class="tiny muted">${esc(tl((ROLES[u.peran] || ROLES.pembeli).l))}</div></div></div>
      <a href="#/akun">${ico('user', 18)} ${tl(['Profil saya','My profile'])}</a><a href="#/pesanan">${ico('bag', 18)} ${t('nav_orders')} (${(S.orders || []).length})</a>`
    : `<div class="pm-head"><span class="avatar lg">?</span><div><b>${tl(['Tamu','Guest'])}</b><div class="tiny muted">${tl(['Belum masuk','Not signed in'])}</div></div></div><a href="#/akun?daftar=${S.settings.roleHint || 'pembeli'}">${ico('check', 18)} ${tl(['Daftar profil','Register'])}</a>${(S.users || []).length ? `<a href="#/akun" data-aktab-go="masuk">${ico('user', 18)} ${tl(['Masuk profil','Sign in'])}</a>` : ''}`) +
    `<a href="#/io">${ico('download', 18)} ${t('nav_io')}</a><button type="button" class="mi" data-tour>${ico('star', 18)} ${tl(['Tur aplikasi','App tour'])}</button>${u ? `<button type="button" class="mi" data-logout>${ico('x', 18)} ${tl(['Keluar','Sign out'])}</button>` : ''}
    <div class="pm-foot"><span class="syncdot inline" data-s="${CLOUD.state}"></span> ${esc(tl(CLOUD_LBL[CLOUD.state] || CLOUD_LBL.local))}</div>`;
  const acts = S.activity || []; const unread = acts.filter(a => !a.read).length;
  $('#actCount').textContent = unread ? Math.min(unread, 9) + (unread > 9 ? '+' : '') : '';
  $('#actMenu').innerHTML = `<div class="pm-head row between" style="display:flex"><b>${tl(['Aktivitas','Activity'])}</b>${unread ? `<button type="button" class="btn sm ghost" data-markread>${tl(['Tandai dibaca','Mark read'])}</button>` : ''}</div>` +
    (acts.length ? acts.slice(0, 8).map(a => `<div class="act ${a.read ? '' : 'unread'}"><span class="ic">${ico(a.ic || 'check', 16)}</span><div><div>${esc(a.teks)}</div><div class="tiny muted">${fmtDT(a.waktu)}</div></div></div>`).join('') : `<p class="small muted" style="padding:8px 10px;margin:0">${tl(['Belum ada aktivitas.','No activity yet.'])}</p>`);
}
function togglePop(id, btn) { const m = $('#' + id); const open = m.hidden; closePops(); if (open) { m.hidden = false; btn.setAttribute('aria-expanded', 'true'); } }
function closePops() { ['userMenu','actMenu'].forEach(id => { const m = $('#' + id); if (m) m.hidden = true; }); ['btnUser','btnBell'].forEach(id => { const b = $('#' + id); if (b) b.setAttribute('aria-expanded', 'false'); }); }

/* ======================= router & shell ======================= */
const NAV_MAIN = [['/', 'nav_home'], ['/stok', 'nav_stock'], ['/cari', 'nav_find'], ['/data', 'nav_data'], ['/produksi', 'nav_prod']];
const NAV_MORE = [['/katalog', 'nav_catalog', 'mill'], ['/pesanan', 'nav_orders', 'bag'], ['/io', 'nav_io', 'download'], ['/referensi', 'nav_ref', 'book'], ['/akun', 'nav_akun', 'user'], ['/kalkulator', 'nav_calc', 'calc'], ['/peta', 'nav_map', 'map'], ['/planner', 'nav_plan', 'planner'], ['/rekomendasi', 'nav_reco', 'reco'], ['/logbook', 'nav_log', 'logbook'], ['/bandingkan', 'nav_cmp', 'cmp'], ['/favorit', 'nav_fav', 'heart'], ['/dashboard', 'nav_dash', 'dash']];
const ROUTES = {'': V.home, 'katalog': V.katalog, 'pabrik': V.pabrik, 'produksi': V.produksi, 'kalkulator': V.kalkulator, 'stok': V.stok, 'briket': V.briket, 'cari': V.cari, 'bandingkan': V.bandingkan, 'data': V.jurnal, 'referensi': V.referensi, 'akun': V.akun, 'pesanan': V.pesanan, 'io': V.io, 'peta': V.peta, 'planner': V.planner, 'rekomendasi': V.rekomendasi, 'logbook': V.logbook, 'favorit': V.favorit, 'dashboard': V.dashboard};
function parseHash() { const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const parts = path.split('/').filter(Boolean); return {seg: parts[0] || '', arg: decodeURIComponent(parts[1] || ''), q: new URLSearchParams(qs || '')}; }
function renderNav() {
  const {seg} = parseHash(); const cur = '/' + (seg === 'pabrik' ? 'katalog' : seg === 'briket' ? 'stok' : seg);
  const inMore = NAV_MORE.some(([h]) => h === cur);
  $('#nav').innerHTML = NAV_MAIN.map(([h, k]) => `<a href="#${h}" class="${cur === h ? 'active' : ''}" ${cur === h ? 'aria-current="page"' : ''}>${t(k)}</a>`).join('') +
    `<div class="dd"><button type="button" class="dd-btn ${inMore ? 'active' : ''}" aria-expanded="false" aria-controls="ddMenu">${tl(['Lainnya','More'])} ${ico('down', 16)}</button><div class="dd-menu" id="ddMenu" hidden>${NAV_MORE.map(([h, k, ic]) => `<a href="#${h}" class="${cur === h ? 'active' : ''}" ${cur === h ? 'aria-current="page"' : ''}>${ico(ic, 18)} ${t(k)}${k === 'nav_fav' && S.favorit.length ? ` (${S.favorit.length})` : ''}</a>`).join('')}</div></div>`;
  $('#favCount').textContent = S.favorit.length || ''; $('#cartCount').textContent = S.cart.length || ''; renderUserMenus();
  renderCmpBar();
}
function applyLang() {
  document.documentElement.lang = lang();
  $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang()));
  $$('[data-i18n]').forEach(n => n.textContent = t(n.dataset.i18n));
  $('#btnSearch').setAttribute('aria-label', tl(['Cari','Search'])); $('#btnFav').setAttribute('aria-label', t('nav_fav')); $('#btnCart').setAttribute('aria-label', tl(['Pesanan','Order']));
  renderFooter();
}
function initShell() {
  $('#brandLink').innerHTML = `${markSVG(40)}<span><b>Eco<span>Briket</span></b><small data-i18n="tagline"></small></span>`;
  $('#btnSearch').insertAdjacentHTML('afterbegin', ico('search', 20)); $('#btnBell').insertAdjacentHTML('afterbegin', ico('bell', 20)); $('#btnFav').insertAdjacentHTML('afterbegin', ico('heart', 20)); $('#btnCart').insertAdjacentHTML('afterbegin', ico('bag', 20));
  $('.menu-btn').innerHTML = ico('menu', 22);
}
let lastSeg = null;
function render() {
  clearInterval(simTimer);
  const {seg, arg, q} = parseHash(); const v = ROUTES[seg] || V.home;
  const app = $('#app'); const sy = window.scrollY;
  app.innerHTML = v.render(arg, q); v.bind && v.bind(arg, q);
  renderNav(); applyLang(); initReveal();
  $('#nav').classList.remove('open'); $('.menu-btn').setAttribute('aria-expanded', 'false');
  const key = seg + '/' + arg;
  if (lastSeg !== key) { window.scrollTo(0, 0); if (lastSeg !== null) app.focus({preventScroll:true}); } else window.scrollTo(0, sy);
  lastSeg = key;
  if (seg === 'produksi' && location.hash.includes('#timer')) setTimeout(() => $('#timer') && $('#timer').scrollIntoView(), 50);
}
const closeDD = () => { const m = $('#ddMenu'); if (m && !m.hidden && getComputedStyle($('.dd-btn')).display !== 'none') { m.hidden = true; $('.dd-btn').setAttribute('aria-expanded', 'false'); } };
document.addEventListener('click', e => {
  const bb = e.target.closest('#btnBell'); if (bb) { togglePop('actMenu', bb); return; }
  const ub = e.target.closest('#btnUser'); if (ub) { togglePop('userMenu', ub); return; }
  if (e.target.closest('[data-markread]')) { (S.activity || []).forEach(a => a.read = true); save(); return; }
  if (e.target.closest('[data-tour]')) { closePops(); openTour(); return; }
  if (e.target.closest('[data-logout]')) { closePops(); logout(); return; }
  if (e.target.closest('[data-aktab-go]')) { S.ui.akTab = e.target.closest('[data-aktab-go]').dataset.aktabGo; }
  if (!e.target.closest('.dd-menu.pop')) closePops();
  const dd = e.target.closest('.dd-btn'); if (dd) { const m = $('#ddMenu'); m.hidden = !m.hidden; dd.setAttribute('aria-expanded', !m.hidden); return; }
  if (!e.target.closest('.dd-menu')) closeDD();
  const fav = e.target.closest('[data-fav]');
  if (fav) { toggleFav(fav.dataset.fav, fav.dataset.tipe); const on = isFav(fav.dataset.fav); $$(`[data-fav="${CSS.escape(fav.dataset.fav)}"]`).forEach(b => { b.setAttribute('aria-pressed', on); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }); toast(on ? tl(['Disimpan ke favorit','Saved to watchlist']) : tl(['Dihapus dari favorit','Removed from watchlist'])); if (parseHash().seg === 'favorit') render(); return; }
  const add = e.target.closest('[data-add]'); if (add) { addToCart(add.dataset.add, 1); return; }
  const qv = e.target.closest('[data-quick]'); if (qv) { openQuick(qv.dataset.quick); return; }
  const cmp = e.target.closest('[data-cmp]'); if (cmp) { toggleCompare(cmp.dataset.cmp); return; }
  if (e.target.closest('[data-cmpclear]')) { S.compare = []; save(); $$('[data-cmp]').forEach(b => b.setAttribute('aria-pressed', 'false')); renderCmpBar(); return; }
  if (e.target.closest('#btnSearch')) { openSearch(); return; }
  if (e.target.closest('#btnCart')) { openCart(); return; }
  if (e.target.closest('[data-cclose]') || e.target.id === 'scrim') { closeCart(); return; }
  const cq = e.target.closest('[data-cq]'); if (cq) { const it = S.cart.find(c => c.id === cq.dataset.cq); if (it) { it.kg = Math.max(1, it.kg + +cq.dataset.d); save(); renderCart(); } return; }
  const crm = e.target.closest('[data-crm]'); if (crm) { S.cart = S.cart.filter(c => c.id !== crm.dataset.crm); save(); renderNav(); renderCart(); return; }
  if (e.target.closest('[data-cclear]')) { S.cart = []; save(); renderNav(); renderCart(); return; }
  if (e.target.closest('[data-checkout]')) { checkout(); return; }
  const wa = e.target.closest('[data-wa]'); if (wa) { openWA(wa.dataset.wa, wa.dataset.watype); return; }
  const nx = e.target.closest('[data-bnext]'); if (nx) { moveBatch(nx.dataset.bnext, 1); return; }
  const pv = e.target.closest('[data-bprev]'); if (pv) { moveBatch(pv.dataset.bprev, -1); return; }
  if (e.target.closest('[data-close]') || e.target.id === 'modal') { closeModal(); return; }
  const lg = e.target.closest('[data-lang]'); if (lg) { S.settings.lang = lg.dataset.lang; save(); render(); return; }
  const tl2 = e.target.closest('a[href="#timer"]'); if (tl2) { e.preventDefault(); $('#timer').scrollIntoView({behavior:'smooth'}); }
});
document.addEventListener('change', e => { const ci = e.target.closest('[data-ci]'); if (ci) { const it = S.cart.find(c => c.id === ci.dataset.ci); if (it) { it.kg = Math.max(1, Math.round(num(ci.value, 1))); save(); renderCart(); } } });
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#modal').hidden) { e.preventDefault(); openSearch(); return; } if (e.key !== 'Escape') return; closePops(); if (!$('#modal').hidden) closeModal(); else if (!$('#drawer').hidden) closeCart(); else closeDD(); });
$('.menu-btn').addEventListener('click', e => { const n = $('#nav'); const o = n.classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', o); });
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', window.scrollY > 8), {passive: true});
window.addEventListener('hashchange', render);
load(); if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.compare)) S.compare = [];
initShell(); timerTick(); render();
if (!S.settings.onboarded) setTimeout(() => { if ($('#modal').hidden) openTour(); }, 700);
initServer().then(on => { if (!on) initCloud(); });
</script>
</body>
